<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Spark</title>
  <style>
    :root {
      color-scheme: light dark;
      --ground: #FAF9F7;
      --surface: #FFFFFF;
      --ink: #25282B;
      --muted: #6C6F71;
      --line: #E4E2DD;
      --accent: #FF6632;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #191B1D;
        --surface: #232628;
        --ink: #ECEFF1;
        --muted: #A2A7AB;
        --line: #34383B;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--ground);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(100%, 440px);
      padding: clamp(24px, 6vw, 40px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .spark { color: var(--accent); font-size: 28px; }
    h1 { margin: 16px 0 10px; font-size: 24px; letter-spacing: -.02em; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <span class="spark" aria-hidden="true">✦</span>
    <h1>Open your shared link</h1>
    <p>Please use the complete link provided to you.</p>
  </main>
</body>
</html>
