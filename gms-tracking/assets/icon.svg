<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GMS">
  <!-- The GMS ball, redrawn as vector so it stays sharp at 16px in a browser
       tab. Colours sampled from assets/gms-logo.png: #12A1E8 / #FF6632. -->
  <defs>
    <clipPath id="ball"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>
  <g clip-path="url(#ball)">
    <rect x="0" y="0" width="64" height="32" fill="#12A1E8"/>
    <rect x="0" y="32" width="64" height="32" fill="#FF6632"/>
    <ellipse cx="32" cy="32" rx="34" ry="11" fill="#FFFFFF"/>
  </g>
  <circle cx="32" cy="32" r="9" fill="#FF6632"/>
</svg>
