name: Refresh RMIT PR Dashboard snapshot

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rmit-pr-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pr-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pr-dashboard/package-lock.json
      - run: npm ci
      - name: Refresh Meltwater snapshot
        env:
          MELTWATER_API_KEY: ${{ secrets.MELTWATER_API_KEY }}
          MELTWATER_SEARCH_ID: '29175637'
        run: npm run refresh:snapshot
      - run: npm test
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/meltwater.json; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meltwater.json
          git commit -m "Refresh RMIT PR dashboard snapshot"
          git push
